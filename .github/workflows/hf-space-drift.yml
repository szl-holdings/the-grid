name: HF Space drift watch

# Read-only daily watch over the Hugging Face Space SZLHOLDINGS/the-grid.
# hf-space.yml only runs when a published file is pushed, so a Hub credential
# that dies, or a Space that drifts from main, stayed invisible until the next
# deploy attempt. This workflow turns red between pushes instead. It never
# publishes: it calls no deployer, passes no secret to any writer, and the drift
# job holds no credential at all.
#
#   credential: the same authorization-metadata census as hf-space.yml's credential job
#               (tests/test_space_contract.py requires the step to be identical);
#               red when no candidate secret can write to the exact Space.
#   drift:      anonymous GETs only (.github/scripts/hf_space_drift.py). Red unless
#               the Space is RUNNING on its Hub head, every published file's Hub
#               blob oid equals main, and / and /healthz return HTTP 200 with the
#               exact bytes of the committed files the Dockerfile serves there.
#
# Its concurrency group is deliberately NOT the hf-write/space lock: a pending
# watch run must never be able to displace a pending deploy.

"on":
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hf-space-drift/SZLHOLDINGS/the-grid
  cancel-in-progress: false

jobs:
  credential:
    name: Hub credential census (read-only metadata)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: select
        env:
          CANDIDATE_HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          CANDIDATE_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUB_ORG: SZLHOLDINGS
          HUB_SPACE: SZLHOLDINGS/the-grid
        shell: python
        run: |
          import json, os, re, urllib.error, urllib.request

          org = os.environ["HUB_ORG"]
          space = os.environ["HUB_SPACE"]

          def read_json(url, token):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read(1024 * 1024 + 1)
              if len(data) > 1024 * 1024:
                  raise ValueError("provider response exceeds limit")
              obj = json.loads(data)
              if not isinstance(obj, dict):
                  raise ValueError("provider response is not an object")
              return obj

          def can_write_target(who, info):
              auth = who.get("auth")
              access = auth.get("accessToken") if isinstance(auth, dict) else None
              if not isinstance(access, dict):
                  return False
              orgs = who.get("orgs")
              members = [o for o in orgs if isinstance(o, dict) and o.get("name") == org] if isinstance(orgs, list) else []
              if len(members) != 1:
                  return False
              member = members[0]
              restrictions = member.get("securityRestrictions", [])
              if member.get("roleInOrg") not in {"admin", "write"} or not isinstance(restrictions, list) or restrictions:
                  return False
              kind = access.get("role")
              grant = kind == "write"
              if kind == "fineGrained":
                  fine = access.get("fineGrained")
                  scoped = fine.get("scoped") if isinstance(fine, dict) else None
                  for entry in scoped if isinstance(scoped, list) else []:
                      entity = entry.get("entity") if isinstance(entry, dict) else None
                      permissions = entry.get("permissions") if isinstance(entry, dict) else None
                      if not isinstance(entity, dict) or not isinstance(permissions, list) or "repo.write" not in permissions:
                          continue
                      grant = grant or (entity.get("type") == "org" and entity.get("name") == org) or (entity.get("type") == "space" and entity.get("name") == space)
              if not grant or info.get("id") != space:
                  return False
              group = info.get("resourceGroup")
              if group is None:
                  # Omitted public metadata is not proof that no group exists.
                  return member.get("roleInOrg") == "admin"
              if not isinstance(group, dict) or not isinstance(group.get("id"), str) or not re.fullmatch(r"[0-9a-f]{24}", group["id"]):
                  return False
              groups = member.get("resourceGroups")
              matches = [g for g in groups if isinstance(g, dict) and g.get("id") == group["id"]] if isinstance(groups, list) else []
              return member.get("roleInOrg") == "admin" or (len(matches) == 1 and matches[0].get("role") in {"admin", "write"})
          rows, pick = [], ""
          for name in ("HF_ORG_TOKEN", "HF_TOKEN"):
              token = os.environ.get(f"CANDIDATE_{name}", "")
              row = {"secret": name, "present": bool(token)}
              if token:
                  try:
                      who = read_json("https://huggingface.co/api/whoami-v2", token)
                      info = read_json(f"https://huggingface.co/api/spaces/{space}?expand=resourceGroup", token)
                      auth = who.get("auth") if isinstance(who.get("auth"), dict) else {}
                      access = auth.get("accessToken") if isinstance(auth.get("accessToken"), dict) else {}
                      kind = access.get("role") or "unknown"
                      can_write = can_write_target(who, info)
                      row.update(valid=True, kind=kind, expires=auth.get("expiresAt"), can_write=can_write)
                  except urllib.error.HTTPError as err:
                      row.update(valid=False, http=err.code)
                  except (OSError, ValueError, TypeError) as err:
                      row.update(valid=False, error=type(err).__name__)
              rows.append(row)
              if not pick and row.get("can_write"):
                  pick = name

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Hub credential census\n\n| secret | present | valid | kind | can write | expires |\n|---|---|---|---|---|---|\n")
              for r in rows:
                  summary.write(f"| {r['secret']} | {r['present']} | {r.get('valid', '-')} | {r.get('kind', r.get('http', '-'))} | {r.get('can_write', '-')} | {r.get('expires') or '-'} |\n")
          print(json.dumps(rows))
          if not pick:
              raise SystemExit(f"No candidate secret has verified write authorization for {space}; rotate HF_ORG_TOKEN (organization) or HF_TOKEN (repository).")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pick={pick}\n")

  drift:
    name: Public Space serves main
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPACE_ID: SZLHOLDINGS/the-grid
      # The deploy set: Dockerfile COPY sources plus the Dockerfile and the card.
      # tests/test_space_contract.py requires this to equal the Dockerfile.
      PUBLISHED_PATHS: '["ALIGN.md", "Dockerfile", "README.md", "healthz", "play.html"]'
      # Served route -> committed file the Dockerfile serves there.
      SERVED_PATHS: '{"/": "play.html", "/healthz": "healthz"}'
    steps:
      - name: Check out exact main revision without third-party actions
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Compare the live Space with main (anonymous GETs only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -P .github/scripts/hf_space_drift.py \
            --space "$SPACE_ID" \
            --paths "$PUBLISHED_PATHS" \
            --served "$SERVED_PATHS" \
            --settle-seconds 1200 \
            --interval 60
