name: HF Space deploy

# The single committed writer for the Hugging Face Space SZLHOLDINGS/the-grid.
# It calls the org's reusable Dockerfile-derived deployer, which:
#   - publishes exactly the Dockerfile COPY sources, the Dockerfile and the
#     README card as one Hub commit whose title names this source commit;
#   - reads the Space API back until it reports that exact Hub commit RUNNING
#     (fails on BUILD_ERROR / CONFIG_ERROR / RUNTIME_ERROR);
#   - re-fetches every published file at that Hub commit and compares sha256;
#   - requires every smoke path below to return HTTP 200 with a body.
# It never runs on pull requests; tests/test_space_contract.py and
# publication-contract.yml check this file on every PR.
#
# Credential selection: a repository secret silently shadows the organization
# secret of the same name, and a stale repository HF_TOKEN made every deploy
# fail with HTTP 401 from 2026-10-04. The credential job asks the Hub whoami
# endpoint about each candidate (organization HF_ORG_TOKEN first, then
# HF_TOKEN), records only its validity, token kind and expiry in the job
# summary, and hands the deployer the first candidate that can write. It fails
# closed, naming the secrets to rotate, when none can.

"on":
  push:
    branches: [main]
    # Every published input. tests/test_space_contract.py fails if a Dockerfile
    # COPY source is missing here, so a new served file cannot skip deploy.
    paths:
      - Dockerfile
      - Dockerfile.dockerignore
      - .dockerignore
      - play.html
      - healthz
      - README.md
      - ALIGN.md
      - .github/workflows/hf-space.yml
  workflow_dispatch: {}

permissions:
  contents: read

# One lock per Hub asset (hf-write/<type>/<owner>/<id>), never keyed by event.
concurrency:
  group: hf-write/space/SZLHOLDINGS/the-grid
  cancel-in-progress: false

jobs:
  credential:
    name: Select a Hub credential that can write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pick: ${{ steps.select.outputs.pick }}
    steps:
      - id: select
        env:
          CANDIDATE_HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
          CANDIDATE_HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUB_ORG: SZLHOLDINGS
          HUB_SPACE: SZLHOLDINGS/the-grid
        shell: python
        run: |
          import json, os, re, urllib.error, urllib.request

          org = os.environ["HUB_ORG"]
          space = os.environ["HUB_SPACE"]

          def read_json(url, token):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read(1024 * 1024 + 1)
              if len(data) > 1024 * 1024:
                  raise ValueError("provider response exceeds limit")
              obj = json.loads(data)
              if not isinstance(obj, dict):
                  raise ValueError("provider response is not an object")
              return obj

          def can_write_target(who, info):
              auth = who.get("auth")
              access = auth.get("accessToken") if isinstance(auth, dict) else None
              if not isinstance(access, dict):
                  return False
              orgs = who.get("orgs")
              members = [o for o in orgs if isinstance(o, dict) and o.get("name") == org] if isinstance(orgs, list) else []
              if len(members) != 1:
                  return False
              member = members[0]
              restrictions = member.get("securityRestrictions", [])
              if member.get("roleInOrg") not in {"admin", "write"} or not isinstance(restrictions, list) or restrictions:
                  return False
              kind = access.get("role")
              grant = kind == "write"
              if kind == "fineGrained":
                  fine = access.get("fineGrained")
                  scoped = fine.get("scoped") if isinstance(fine, dict) else None
                  for entry in scoped if isinstance(scoped, list) else []:
                      entity = entry.get("entity") if isinstance(entry, dict) else None
                      permissions = entry.get("permissions") if isinstance(entry, dict) else None
                      if not isinstance(entity, dict) or not isinstance(permissions, list) or "repo.write" not in permissions:
                          continue
                      grant = grant or (entity.get("type") == "org" and entity.get("name") == org) or (entity.get("type") == "space" and entity.get("name") == space)
              if not grant or info.get("id") != space:
                  return False
              group = info.get("resourceGroup")
              if group is None:
                  # Omitted public metadata is not proof that no group exists.
                  return member.get("roleInOrg") == "admin"
              if not isinstance(group, dict) or not isinstance(group.get("id"), str) or not re.fullmatch(r"[0-9a-f]{24}", group["id"]):
                  return False
              groups = member.get("resourceGroups")
              matches = [g for g in groups if isinstance(g, dict) and g.get("id") == group["id"]] if isinstance(groups, list) else []
              return member.get("roleInOrg") == "admin" or (len(matches) == 1 and matches[0].get("role") in {"admin", "write"})
          rows, pick = [], ""
          for name in ("HF_ORG_TOKEN", "HF_TOKEN"):
              token = os.environ.get(f"CANDIDATE_{name}", "")
              row = {"secret": name, "present": bool(token)}
              if token:
                  try:
                      who = read_json("https://huggingface.co/api/whoami-v2", token)
                      info = read_json(f"https://huggingface.co/api/spaces/{space}?expand=resourceGroup", token)
                      auth = who.get("auth") if isinstance(who.get("auth"), dict) else {}
                      access = auth.get("accessToken") if isinstance(auth.get("accessToken"), dict) else {}
                      kind = access.get("role") or "unknown"
                      can_write = can_write_target(who, info)
                      row.update(valid=True, kind=kind, expires=auth.get("expiresAt"), can_write=can_write)
                  except urllib.error.HTTPError as err:
                      row.update(valid=False, http=err.code)
                  except (OSError, ValueError, TypeError) as err:
                      row.update(valid=False, error=type(err).__name__)
              rows.append(row)
              if not pick and row.get("can_write"):
                  pick = name

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Hub credential census\n\n| secret | present | valid | kind | can write | expires |\n|---|---|---|---|---|---|\n")
              for r in rows:
                  summary.write(f"| {r['secret']} | {r['present']} | {r.get('valid', '-')} | {r.get('kind', r.get('http', '-'))} | {r.get('can_write', '-')} | {r.get('expires') or '-'} |\n")
          print(json.dumps(rows))
          if not pick:
              raise SystemExit(f"No candidate secret has verified write authorization for {space}; rotate HF_ORG_TOKEN (organization) or HF_TOKEN (repository).")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pick={pick}\n")

  deploy:
    name: Deploy exact source and attest live Space
    needs: credential
    uses: szl-holdings/.github/.github/workflows/reusable-hf-deploy.yml@a9546a72c550a83ed5ae535bdab61ccdfa689e65
    with:
      hf-repo: SZLHOLDINGS/the-grid
      ref: ${{ github.sha }}
      require-default-branch-tip: true
      dockerfile-path: Dockerfile
      include-readme: true
      prune: false
      wait-running: 900
      smoke-paths: '["/","/healthz"]'
    secrets:
      HF_TOKEN: ${{ needs.credential.outputs.pick == 'HF_ORG_TOKEN' && secrets.HF_ORG_TOKEN || secrets.HF_TOKEN }}
